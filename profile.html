<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>트레이너 카드</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 대기실 팝업(embed=1)에서는 숨김 -->
    <header class="topbar">
        <a href="main.html">방 목록</a>
        <span class="grow"></span>
    </header>

    <main class="trainer-card" id="trainer-card">
        <!-- 좌측 40%: 프로필 사진 -->
        <section class="card-left">
            <label class="avatar" id="avatar" title="클릭해서 프로필 사진 변경" tabindex="0" role="button" aria-label="프로필 사진 변경">
                <img id="avatar-img" alt="트레이너 프로필 사진" hidden>
                <span class="avatar-placeholder" id="avatar-placeholder">이미지 추가</span>
                <span class="avatar-edit" aria-hidden="true">사진 변경</span>
                <span class="avatar-uploading" id="avatar-uploading" hidden>업로드 중…</span>
                <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            </label>
            <div class="trainer-identity"><h1 class="trainer-name" id="trainer-name">…</h1></div>
            <p class="card-message" id="card-message" role="status"></p>
        </section>

        <!-- 우측 60%: 포켓몬 3 x 2 -->
        <section class="card-right">
            <header class="party-heading"><h2>포켓몬</h2><span class="party-count" id="party-count">0 / 6</span></header>
            <div class="party-grid" id="party-grid" aria-label="파트너 포켓몬"></div>
        </section>
    </main>

    <!-- 포켓몬 검색 모달 -->
    <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
        <h2 id="search-title">포켓몬 추가</h2>
        <form method="dialog" class="search-head">
            <input type="search" id="search-input" aria-label="포켓몬 이름 또는 도감 번호" placeholder="포켓몬 이름 또는 도감 번호" autocomplete="off">
            <button class="search-close" value="cancel" >닫기</button>
        </form>
        <div class="search-results" id="search-results"></div>
    </dialog>

    <script type="module" src="js/profile.js"></script>

</body>
</html>
