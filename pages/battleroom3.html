<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>// SIM-03</title>
</head>
<body>

    <header class="topbar">
        <a href="../main.html">VOYAGER</a>
        <span class="grow"></span>
        <span id="room-status" data-status="waiting"><span>WAITING</span></span>
    </header>

    <main>
        <h1 id="room-name">SIM-03</h1>

        <div id="swap-status" class="swap-banner" role="status" hidden></div>

        <section class="versus">
            <article id="player1" class="player-card" data-state="empty"></article>
            <div>VS</div>
            <article id="player2" class="player-card" data-state="empty"></article>
        </section>

        <p id="lobby-hint" class="lobby-hint"></p>

        <section>
            <h2>관전자 (<span id="spectator-count">0</span>)</h2>
            <ul id="spectator-list" class="spectator-list"></ul>
        </section>
    </main>

    <footer class="lobby-actions">
        <button type="button" id="leaveBtn">LEAVE</button>
        <button type="button" id="readyBtn" aria-pressed="false">READY</button>
    </footer>

    <script>
    const ROOM_ID = "battleroom3";
    </script>
    <script type="module" src="../js/battleroom.js"></script>
</body>
</html>
