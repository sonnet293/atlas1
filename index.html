<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>로그인</h1>

  <form id="auth-form" class="login-form" autocomplete="on" novalidate>
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" />
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit" id="login-btn">로그인</button>
    <div class="login-error" id="login-error" role="alert"></div>
  </form>

  <noscript><p>JavaScript가 필요합니다.</p></noscript>

  <script type="module" src="js/login.js"></script>
</body>
</html>
